[project]
name = "doosan"
version = "0.1.0"
description = "Telemetry receiver and remote controller for the SimArena Doosan A0509 wear simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "rich>=13.7",
]

[project.scripts]
doosan-server = "doosan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doosan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
